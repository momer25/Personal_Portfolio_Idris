<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gharo English-Tigre-Arabic Dictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b2a4a; --navy-dark:#101a30; --teal:#1f7a72; --amber:#d99a3d;
    --bg:#f6f5f1; --card:#ffffff; --text:#22262f; --muted:#6b7280; --border:#e6e3da;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;padding:28px 20px 22px;text-align:center;}
  header h1{margin:0;font-size:1.4rem;letter-spacing:.3px;}
  header p{margin:6px 0 0;color:#c9d2e6;font-size:.85rem;}
  .search-wrap{max-width:700px;margin:-20px auto 0;padding:0 16px;position:relative;z-index:2;}
  #search{width:100%;padding:14px 44px 14px 16px;font-size:1.05rem;border-radius:12px;border:1px solid var(--border);box-shadow:0 6px 18px rgba(16,26,48,.15);outline:none;font-family:inherit;}
  #search:focus{border-color:var(--teal);}
  .search-icon{position:absolute;right:32px;top:14px;color:var(--muted);pointer-events:none;}
  .meta-row{max-width:700px;margin:10px auto 0;padding:0 16px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);}
  .alphabet{max-width:900px;margin:16px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .alphabet button{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:.78rem;color:var(--navy);cursor:pointer;font-weight:600;}
  .alphabet button:hover{background:var(--teal);color:#fff;border-color:var(--teal);}
  main{max-width:900px;margin:18px auto 60px;padding:0 16px;}
  #results{display:flex;flex-direction:column;gap:10px;}
  .entry{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .entry-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px;}
  .headword{font-size:1.08rem;font-weight:700;color:var(--navy);}
  .pron{color:var(--amber);font-family:'Noto Sans Ethiopic',serif;font-size:.98rem;}
  .pos{font-size:.75rem;color:var(--teal);font-style:italic;background:#eaf5f3;padding:2px 7px;border-radius:20px;}
  .tigre{margin-top:6px;font-family:'Noto Sans Ethiopic',serif;font-size:1.15rem;line-height:1.6;color:#1c2333;}
  .arabic-row{margin-top:6px;display:flex;gap:8px;align-items:baseline;}
  .arabic-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;flex-shrink:0;}
  .arabic{font-family:'Noto Sans Arabic',serif;font-size:1.15rem;line-height:1.6;color:#3a2d1c;direction:rtl;text-align:right;flex:1;}
  .arabic-missing{font-size:.78rem;color:var(--muted);font-style:italic;}
  .count-badge{color:var(--muted);}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;}
  .loadmore{display:block;margin:18px auto 0;padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--navy);font-weight:600;cursor:pointer;}
  .loadmore:hover{background:var(--teal);color:#fff;border-color:var(--teal);}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:0 16px 30px;}
  mark{background:#fce7b8;color:inherit;border-radius:2px;padding:0 1px;}
  .lang-toggle{max-width:700px;margin:10px auto 0;padding:0 16px;display:flex;gap:8px;justify-content:center;}
  .lang-toggle button{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.78rem;color:var(--navy);cursor:pointer;font-weight:600;}
  .lang-toggle button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
</style>
</head>
<body>
<header>
  <h1>Gharo &mdash; English&ndash;Tigre&ndash;Arabic Dictionary</h1>
  <p>By Mohamedidris Hamed Omer (MSc) &middot; Author &amp; Lexicographer</p>
</header>
<div class="search-wrap">
  <input id="search" type="text" disabled placeholder="Search English, ትግረ or العربية&hellip;" autocomplete="off" spellcheck="false">
  <span class="search-icon">&#128269;</span>
</div>
<div class="meta-row">
  <span id="count" class="count-badge"></span>
  <span id="total">loading…</span>
</div>
<div class="alphabet" id="alphabet"></div>
<main>
  <div id="results"></div>
  <button id="loadmore" class="loadmore" style="display:none;">Show more</button>
</main>
<script>
let DATA = [];

const results = document.getElementById('results');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const alphaEl = document.getElementById('alphabet');
const loadMoreBtn = document.getElementById('loadmore');

const PAGE = 60;
let currentList = [];
let shown = 0;
let currentQuery = '';

function escapeHtml(s){
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}

function renderChunk(){
  const chunk = currentList.slice(shown, shown + PAGE);
  const frag = document.createDocumentFragment();
  chunk.forEach(e => {
    const div = document.createElement('div');
    div.className = 'entry';
    const arabicHtml = e.arabic
      ? `<div class="arabic-row"><span class="arabic-label">AR</span><span class="arabic">${highlight(e.arabic, currentQuery)}</span></div>`
      : `<div class="arabic-row"><span class="arabic-label">AR</span><span class="arabic-missing">not yet translated</span></div>`;
    div.innerHTML = `
      <div class="entry-head">
        <span class="headword">${highlight(e.word, currentQuery)}</span>
        <span class="pron">[${escapeHtml(e.pron)}]</span>
        <span class="pos">${escapeHtml(e.pos)}</span>
      </div>
      <div class="tigre">${highlight(e.tigre, currentQuery)}</div>
      ${arabicHtml}
    `;
    frag.appendChild(div);
  });
  results.appendChild(frag);
  shown += chunk.length;
  loadMoreBtn.style.display = shown < currentList.length ? 'block' : 'none';
}

function runSearch(q){
  currentQuery = q.trim();
  results.innerHTML = '';
  shown = 0;
  if(!currentQuery){
    currentList = [];
    countEl.textContent = 'Search across English, Tigre (ትግረ) and Arabic (العربية) at once, or browse by letter below';
    loadMoreBtn.style.display = 'none';
    return;
  }
  // Unified search: checks English headword, Tigre translation, Arabic
  // translation, and pronunciation together, regardless of which script
  // was typed.
  const ql = currentQuery.toLowerCase();
  const starts = [];
  const contains = [];
  for(const e of DATA){
    const w = e.word.toLowerCase();
    const wordStarts = w.startsWith(ql);
    const wordContains = !wordStarts && w.includes(ql);
    const tigreHit = e.tigre.includes(currentQuery);
    const pronHit = e.pron.includes(currentQuery);
    const arabicHit = e.arabic && e.arabic.includes(currentQuery);

    if(wordStarts){
      starts.push(e);
    } else if(wordContains || tigreHit || pronHit || arabicHit){
      contains.push(e);
    }
  }
  starts.sort((a,b)=>a.word.localeCompare(b.word));
  contains.sort((a,b)=>a.word.localeCompare(b.word));
  currentList = starts.concat(contains);
  if(currentList.length === 0){
    countEl.textContent = 'No matches';
    results.innerHTML = '<div class="empty">No entries found for "' + escapeHtml(currentQuery) + '"</div>';
    return;
  }
  countEl.textContent = currentList.length + (currentList.length === 1 ? ' match' : ' matches');
  renderChunk();
}

function browseLetter(letter){
  searchEl.value = '';
  currentQuery = '';
  results.innerHTML = '';
  shown = 0;
  currentList = DATA.filter(e => e.word[0].toUpperCase() === letter).sort((a,b)=>a.word.localeCompare(b.word));
  countEl.textContent = currentList.length + ' entries starting with "' + letter + '"';
  renderChunk();
}

function buildAlphabet(){
  alphaEl.innerHTML = '';
  const letters = [...new Set(DATA.map(e => e.word[0].toUpperCase()))].sort();
  letters.forEach(l => {
    const btn = document.createElement('button');
    btn.textContent = l;
    btn.onclick = () => browseLetter(l);
    alphaEl.appendChild(btn);
  });
}

let debounceTimer;
searchEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => runSearch(searchEl.value), 120);
});
loadMoreBtn.addEventListener('click', renderChunk);

/* ---- dictionary data ---------------------------------------------------
   The word list is fetched from data/dictionary.json rather than embedded
   in this page, and cached by the browser after the first visit.         */
const DATA_URL = 'data/dictionary.json';
const CACHE_NAME = 'gharo-dictionary-v1';

async function fetchDictionary(){
  if('caches' in window){
    try{
      const cache = await caches.open(CACHE_NAME);
      const hit = await cache.match(DATA_URL);
      if(hit) return hit.json();
      const res = await fetch(DATA_URL);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      cache.put(DATA_URL, res.clone());
      return res.json();
    }catch(err){ /* fall through to a plain fetch */ }
  }
  const res = await fetch(DATA_URL);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

countEl.textContent = 'Loading the dictionary\u2026';
fetchDictionary().then(rows => {
  DATA = rows.map(r => ({
    word: r.w,
    pron: r.p || '',
    pos: r.o || '',
    tigre: r.t || '',
    arabic: r.a2 || r.a || ''
  }));
  document.getElementById('total').textContent = DATA.length.toLocaleString() + ' entries';
  searchEl.disabled = false;
  buildAlphabet();
  runSearch(searchEl.value || '');
  searchEl.focus();
}).catch(err => {
  console.error('Dictionary load failed:', err);
  document.getElementById('total').textContent = 'unavailable';
  countEl.textContent = 'The word list could not be loaded.';
  results.innerHTML = '<div class="empty">data/dictionary.json did not load. Serve these files over http(s) \u2014 opening the page straight from disk blocks the request.</div>';
});
</script>
</body>
</html>
